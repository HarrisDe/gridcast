[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridcast"
version = "0.1.0"
description = "Electricity load forecasting service: fine-tuned Chronos-2 served with FastAPI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
ml = [
    "lightgbm>=4.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gridcast"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=gridcast --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
